<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waddle Waddle NY — We've Moved</title>
<link rel="canonical" href="https://sduwangtong.github.io/waddle-party-booking-live/" />
<meta name="robots" content="noindex" />
<!-- No-JS / fallback redirect after 3s -->
<meta http-equiv="refresh" content="3; url=https://sduwangtong.github.io/waddle-party-booking-live/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#3A3550; --muted:#6E6886; --line:#ECE7F5;
    --bg:#F1E9F6; --card:#FFFFFF; --accent:#8B7DE8; --accentd:#7644C4;
    --sage:#BED0B7; --shadow:0 10px 30px rgba(120,80,200,.12); --radius:20px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
    color:var(--ink); background:var(--bg);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card {
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    max-width:460px; width:100%; text-align:center; overflow:hidden;
  }
  .card .hero { background:var(--sage); padding:28px 24px 22px; }
  .card .hero img { display:block; height:84px; width:auto; margin:0 auto; }
  .body { padding:26px 28px 30px; }
  h1 { font-size:22px; margin:0 0 10px; font-weight:700; }
  p { color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 22px; }
  .cta {
    display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
    font-weight:600; font-size:16px; padding:14px 26px; border-radius:999px;
    box-shadow:0 6px 16px rgba(120,80,200,.28); transition:background .15s ease;
  }
  .cta:hover { background:var(--accentd); }
  .small { display:block; margin-top:16px; font-size:13px; color:var(--muted); }
  .small a { color:var(--accent); }
</style>
</head>
<body>
  <main class="card">
    <div class="hero">
      <img src="assets/logo.png" alt="Waddle Waddle NY" />
    </div>
    <div class="body">
      <h1>🎈 We've moved! 🎈</h1>
      <p>Our booking site has a new home. You'll be redirected automatically — or tap below to book your party now.</p>
      <a class="cta" href="https://sduwangtong.github.io/waddle-party-booking-live/">Go to our booking site →</a>
      <span class="small">Not redirected? <a href="https://sduwangtong.github.io/waddle-party-booking-live/">Click here</a></span>
    </div>
  </main>
  <script>
    // Immediate redirect (replace = don't trap the back button)
    setTimeout(function () {
      window.location.replace("https://sduwangtong.github.io/waddle-party-booking-live/");
    }, 1200);
  </script>
</body>
</html>
