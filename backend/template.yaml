AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Waddle Waddle NY — party-booking deposit payments (Stripe Checkout + webhook + SES). Slots capped at 3 active bookings via a DynamoDB byDate index.

Parameters:
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key (sk_live_... or sk_test_...)
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret (whsec_...). Use a placeholder on first deploy, then set the real value after registering the endpoint.
  SenderEmail:
    Type: String
    Default: info@waddlewaddleny.com
    Description: Domain-verified SES sender (From) for both emails
  VenueEmail:
    Type: String
    Default: info@waddlewaddleny.com
    Description: Where the new-booking alert is delivered
  AllowedOrigin:
    Type: String
    Default: https://sduwangtong.github.io
    Description: Primary site origin allowed to call the API (CORS) and base for success/cancel redirects
  SuccessPath:
    Type: String
    Default: /waddle-party-booking/
    Description: Path under AllowedOrigin to redirect back to after checkout

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 15
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref BookingsTable
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        SES_SENDER_EMAIL: !Ref SenderEmail
        VENUE_EMAIL: !Ref VenueEmail

Resources:
  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-bookings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
        - AttributeName: dateISO
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byDate
          KeySchema:
            - AttributeName: dateISO
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - https://book.waddlewaddleny.com
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-CreateCheckout"
      Handler: createCheckout/index.handler
      CodeUri: functions/
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          SUCCESS_PATH: !Ref SuccessPath
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt BookingsTable.Arn
                - !Sub "${BookingsTable.Arn}/index/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /create-checkout
            Method: POST

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-StripeWebhook"
      Handler: stripeWebhook/index.handler
      CodeUri: functions/
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt BookingsTable.Arn
                - !Sub "${BookingsTable.Arn}/index/*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /stripe-webhook
            Method: POST

  AvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-Availability"
      Handler: availability/index.handler
      CodeUri: functions/
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt BookingsTable.Arn
                - !Sub "${BookingsTable.Arn}/index/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /availability
            Method: GET

Outputs:
  ApiBaseUrl:
    Description: Base URL — put this in index.html API_BASE
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  CreateCheckoutUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/create-checkout"
  WebhookUrl:
    Description: Register this as the Stripe webhook endpoint (event checkout.session.completed)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/stripe-webhook"
